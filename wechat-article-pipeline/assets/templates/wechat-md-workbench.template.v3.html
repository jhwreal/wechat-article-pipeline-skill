<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>公众号 Markdown 工作台</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --text: #1f2329;
      --muted: #667085;
      --line: #e5e7eb;
      --primary: #17b394;
      --accent: #d14d72;
      --radius: 16px;
      --shadow: 0 8px 30px rgba(16,24,40,.08);
      --preview-font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      --content-width: 430px;
      --wechat-side-padding: 8px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      min-height: 64px;
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 18px;
      gap: 16px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .brand-badge {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), #48d1b8);
      box-shadow: 0 8px 20px rgba(23,179,148,.22);
      flex: 0 0 auto;
    }
    .brand-text { min-width: 0; }
    .brand-title { font-size: 16px; font-weight: 700; white-space: nowrap; }
    .brand-sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
      flex: 1;
    }
    .btn, .field, .select, .color {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 12px;
      height: 38px;
      padding: 0 12px;
      font-size: 14px;
      color: var(--text);
    }
    .btn {
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 600;
      transition: .16s ease;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 18px rgba(16,24,40,.08); }
    .btn.primary {
      background: var(--primary);
      color: #fff;
      border-color: transparent;
      min-width: 128px;
    }
    .field, .select { min-width: 110px; }
    .color { padding: 6px; width: 44px; }

    .main {
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      gap: 16px;
      padding: 16px;
      min-height: calc(100vh - 64px);
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #fff, #fcfdff);
    }
    .panel-title { font-size: 14px; font-weight: 700; }
    .panel-desc { font-size: 12px; color: var(--muted); }

    .editor-wrap { flex: 1; min-height: 0; background: var(--panel); }
    #editor {
      width: 100%;
      height: 100%;
      min-height: 70vh;
      border: 0;
      outline: none;
      resize: none;
      padding: 22px 22px 30px;
      font-size: 15px;
      line-height: 1.75;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      background: linear-gradient(180deg, #ffffff, #fbfcff);
      color: #0f172a;
      tab-size: 2;
    }

    .preview-shell {
      flex: 1;
      min-height: 0;
      overflow: auto;
      background: #eef2f8;
      padding: 28px 20px 40px;
    }
    .phone-frame {
      width: calc(var(--content-width) + var(--wechat-side-padding) * 2 + 2px);
      margin: 0 auto;
      border-radius: 0;
      background: #fff;
      border: 1px solid #dcdfe5;
      box-shadow: none;
      overflow: hidden;
    }
    .phone-top {
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid #eef2f7;
      background: #fafbfd;
      font-size: 13px;
      color: #667085;
      font-weight: 600;
      letter-spacing: .2px;
    }
    .preview-viewport {
      width: 100%;
      overflow: hidden;
      background: #fff;
    }
    .preview {
      width: var(--content-width);
      margin: 0 auto;
      padding: 18px var(--wechat-side-padding) 42px;
      font-family: var(--preview-font);
      font-size: 16px;
      line-height: 1.75;
      color: #222;
      word-break: break-word;
      background: #fff;
    }

    .preview h1,
    .preview h2,
    .preview h3,
    .preview h4,
    .preview p,
    .preview ul,
    .preview ol,
    .preview blockquote,
    .preview pre,
    .preview table { margin-top: 0; }

    .preview h1 {
      width: fit-content;
      margin: 26px auto 16px;
      font-size: 19px;
      line-height: 1.75;
      font-weight: 700;
      color: #111827;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--primary);
      text-align: center;
    }
    .preview h2 {
      width: fit-content;
      margin: 30px auto 18px;
      font-size: 19px;
      line-height: 1.6;
      font-weight: 700;
      color: #fff;
      background: var(--primary);
      padding: 8px 20px;
      border-radius: 7px;
      box-shadow: 0 4px 10px rgba(15, 23, 42, .16);
      text-align: center;
    }
    .preview h3 {
      width: fit-content;
      margin: 24px 0 14px;
      font-size: 17px;
      line-height: 1.75;
      font-weight: 700;
      color: #111827;
      padding: 0 0 3px 10px;
      border-left: 4px solid var(--primary);
      border-bottom: 1px dashed var(--primary);
    }
    .preview h4 {
      margin: 18px 0 10px;
      font-size: 16px;
      line-height: 1.75;
      font-weight: 700;
      color: var(--primary);
    }
    .preview p {
      margin: 16px 0;
      color: #222;
      font-size: 16px;
      line-height: 1.75;
    }
    .preview strong { font-weight: 700; color: var(--primary); }
    .preview em { color: #444; }
    .preview .inline-accent { color: var(--accent); font-weight: 700; }
    .preview a {
      color: var(--primary);
      text-decoration: none;
      border-bottom: 1px solid rgba(23,179,148,.35);
    }
    .preview hr {
      border: 0;
      border-top: 1px dashed #d0d5dd;
      margin: 28px 0;
    }
    .preview blockquote {
      margin: 18px 0;
      padding: 14px 16px;
      background: #f7f8fa;
      border-left: 4px solid var(--primary);
      color: #3b4552;
      font-size: 16px;
      line-height: 1.75;
      border-radius: 8px;
    }
    .preview blockquote p { margin: 0; color: inherit; }
    .preview ul, .preview ol {
      padding-left: 1.5em;
      margin: 16px 0;
      font-size: 16px;
      line-height: 1.75;
    }
    .preview li { margin: 8px 0; }
    .preview code {
      background: #f2f4f7;
      border: 1px solid #eaecf0;
      border-radius: 6px;
      padding: .12em .38em;
      font-size: .92em;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: var(--accent);
      font-weight: 700;
    }
    .preview pre {
      display: block;
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
      margin: 18px 0;
      padding: 16px;
      overflow: auto;
      background: #111827;
      color: #e5e7eb;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
    }
    .preview pre code {
      display: block;
      background: transparent;
      border: 0;
      color: inherit;
      padding: 0;
      font-size: inherit;
      line-height: inherit;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
    }
    .preview table {
      width: 100%;
      border-collapse: collapse;
      margin: 18px 0;
      display: block;
      overflow-x: auto;
      border: 1px solid #eaecf0;
    }
    .preview table thead tr { background: #f8fafc; }
    .preview th, .preview td {
      padding: 10px 12px;
      border-bottom: 1px solid #eaecf0;
      text-align: left;
      white-space: nowrap;
      font-size: 14px;
    }
    .preview img {
      max-width: 100%;
      display: block;
      margin: 22px auto;
      border-radius: 8px;
    }
    .preview .article-signature {
      display: block;
      margin: 21px 0;
      color: #fff;
      font-size: 14px;
      line-height: 1.45;
      font-weight: 400;
      text-align: center;
    }
    .preview .article-signature span {
      display: inline;
      padding: 1px 5px 2px;
      background: var(--primary);
      color: #fff;
      font-size: inherit;
      line-height: inherit;
      font-weight: inherit;
    }

    .statusbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border-top: 1px solid var(--line);
      padding: 10px 14px;
      font-size: 12px;
      color: var(--muted);
      background: #fff;
    }
    .status-left, .status-right {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #12b76a;
      display: inline-block;
      margin-right: 6px;
    }

    @media (max-width: 1080px) {
      .main { grid-template-columns: 1fr; }
      #editor { min-height: 42vh; }
      .preview-shell { min-height: 50vh; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <div class="brand-badge"></div>
      <div class="brand-text">
        <div class="brand-title">公众号 Markdown 工作台</div>
        <div class="brand-sub">HTML 工作台 · 相对路径配图 · 自动保存</div>
      </div>
    </div>
    <div class="toolbar">
      <select id="fontFamily" class="select">
        <option value='-apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif'>默认中文</option>
        <option value='"PingFang SC", "Microsoft YaHei", sans-serif'>苹方 / 微软雅黑</option>
        <option value='Georgia, "Times New Roman", serif'>衬线</option>
        <option value='Inter, -apple-system, BlinkMacSystemFont, sans-serif'>Inter</option>
      </select>
      <select id="fontSize" class="select">
        <option value="16" selected>16px</option>
        <option value="17">17px</option>
        <option value="18">18px</option>
      </select>
      <input id="themeColor" class="color" type="color" value="#17b394" title="主题色" />
      <button id="saveArticle" class="btn">保存</button>
      <button id="copyWechat" class="btn primary">复制富文本</button>
    </div>
  </div>

  <div class="main">
    <section class="panel">
      <div class="panel-head">
        <div>
          <div class="panel-title">Markdown 编辑区</div>
          <div class="panel-desc">这版去掉了我额外加的顶部标题，只渲染 Markdown 本身。</div>
        </div>
      </div>
      <div class="editor-wrap">
        <textarea id="editor" spellcheck="false"></textarea>
      </div>
      <div class="statusbar">
        <div class="status-left">
          <span><span class="dot"></span><span id="saveStatus">已就绪</span></span>
          <span id="articleStatus">正文已保存</span><span id="manifestStatus">发布清单更新中</span><span id="assetsStatus">图片待复核</span>
          <span id="wordCount">0 字</span>
          <span id="lineCount">0 行</span>
        </div>
        <div class="status-right">
          <span id="storageModeLabel">自动保存：localStorage</span>
          <span>复制：输出预览富文本</span>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div>
          <div class="panel-title">微信风格预览</div>
          <div class="panel-desc">h1=文字同宽下划线；h2=居中底色线；h3=左竖线。</div>
        </div>
      </div>
      <div class="preview-shell">
        <div class="phone-frame">
          <div class="phone-top">公众号图文预览</div>
          <div class="preview-viewport">
            <article id="preview" class="preview"></article>
          </div>
        </div>
      </div>
      <div class="statusbar">
        <div class="status-left">
          <span>模板版本：v10 本地存储兼容版</span>
          <span id="lastSavedLabel">未保存</span>
        </div>
        <div class="status-right">
          <span>不再额外补标题</span>
          <span>复制样式与预览同步</span>
        </div>
      </div>
    </section>
  </div>

  <!-- CLIPBOARD_ASSETS_SCRIPT -->
  <script type="application/json" id="wechat-bootstrap">{{BOOTSTRAP_JSON}}</script>
  <script>{{SAVE_CONTROLLER_JS}}</script>
  <script>
    window.WECHAT_CLIPBOARD_IMAGE_DATA = window.WECHAT_CLIPBOARD_IMAGE_DATA || {};

    const BOOTSTRAP = JSON.parse(document.getElementById('wechat-bootstrap').textContent);
    const DEFAULT_MARKDOWN = BOOTSTRAP.markdown;

    const ARTICLE_METADATA = BOOTSTRAP.metadata || {};
    const ARTICLE_SIGNATURE = BOOTSTRAP.signature || {};
    const STORAGE_KEY = BOOTSTRAP.storageKey;
    const DEFAULT_WORKBENCH_STATE = BOOTSTRAP.workbenchState || {};
    const WORKBENCH_SAVE_ENDPOINT = '/__wechat_workbench/save';
    const editor = document.getElementById('editor');
    const preview = document.getElementById('preview');
    const previewShell = document.querySelector('.preview-shell');
    const themeColor = document.getElementById('themeColor');
    const fontSize = document.getElementById('fontSize');
    const fontFamily = document.getElementById('fontFamily');
    const saveStatus = document.getElementById('saveStatus');
    const articleStatus = document.getElementById('articleStatus');
    const manifestStatus = document.getElementById('manifestStatus');
    const assetsStatus = document.getElementById('assetsStatus');
    const lastSavedLabel = document.getElementById('lastSavedLabel');
    const wordCount = document.getElementById('wordCount');
    const lineCount = document.getElementById('lineCount');
    const storageModeLabel = document.getElementById('storageModeLabel');

    let initializing = true;
    let activeScrollSource = null;
    let scrollReleaseTimer = null;
    let caretSyncFrame = null;

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function inlineFormat(text) {
      return text
        .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img alt="$1" src="$2" />')
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/==([^=\n]+)==/g, '<span class="inline-accent">$1</span>')
        .replace(/(^|[\s（(“‘])'([^'\n]{1,80})'(?![\w])/g, '$1<span class="inline-accent">&#39;$2&#39;</span>')
        .replace(/\*([^*]+)\*/g, '<em>$1</em>');
    }

    function getMarkdownBlocks(md) {
      const normalized = md.replace(/\r\n?/g, '\n');
      const lines = normalized.split('\n');
      const blocks = [];
      let current = [];
      let startLine = 1;
      let inCodeFence = false;

      const pushCurrent = () => {
        if (!current.length) return;
        blocks.push({ text: current.join('\n'), startLine });
        current = [];
      };

      lines.forEach((line, index) => {
        const lineNo = index + 1;
        const trimmed = line.trim();

        if (!current.length) startLine = lineNo;

        if (inCodeFence) {
          current.push(line);
          if (/^```/.test(trimmed)) inCodeFence = false;
          return;
        }

        if (!trimmed) {
          pushCurrent();
          return;
        }

        current.push(line);
        if (/^```/.test(trimmed)) inCodeFence = true;
      });

      pushCurrent();
      return { blocks, lineCount: lines.length || 1 };
    }

    function parseTable(block, startLine) {
      const lines = block.trim().split('\n');
      if (lines.length < 2) return null;
      const rows = lines
        .map(line => line.trim())
        .filter(Boolean)
        .map(line => line.replace(/^\|/, '').replace(/\|$/, '').split('|').map(cell => inlineFormat(escapeHtml(cell.trim()))));
      if (!rows[1].every(cell => /^:?-{3,}:?$/.test(cell.replace(/<[^>]+>/g, '')))) return null;
      const header = rows[0];
      const body = rows.slice(2);
      return `<table class="preview-block" data-source-line="${startLine}"><thead><tr>${header.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${body.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
    }

    function blockquoteToHtml(block, startLine) {
      const lines = block.split('\n').map(line => line.replace(/^>\s?/, '').trim());
      const content = lines.join('<br>');
      return `<blockquote class="preview-block" data-source-line="${startLine}"><p>${inlineFormat(escapeHtml(content))}</p></blockquote>`;
    }

    function markdownToHtml(md) {
      const { blocks } = getMarkdownBlocks(md);
      let html = '';

      for (const { text: rawBlock, startLine } of blocks) {
        const block = rawBlock.trim();
        if (!block) continue;

        const tableHtml = parseTable(block, startLine);
        if (tableHtml) {
          html += tableHtml;
          continue;
        }

        if (/^```/.test(block)) {
          const code = block.replace(/^```[a-zA-Z0-9_-]*\n?/, '').replace(/```$/, '');
          html += `<pre class="preview-block" data-source-line="${startLine}"><code>${escapeHtml(code)}</code></pre>`;
          continue;
        }

        if (/^---+$/.test(block)) {
          html += `<hr class="preview-block" data-source-line="${startLine}" />`;
          continue;
        }

        if (/^>/.test(block)) {
          html += blockquoteToHtml(block, startLine);
          continue;
        }

        if (/^#{1,6}\s/.test(block)) {
          const level = block.match(/^#+/)[0].length;
          const text = block.replace(/^#{1,6}\s+/, '');
          html += `<h${level} class="preview-block" data-source-line="${startLine}">${inlineFormat(escapeHtml(text))}</h${level}>`;
          continue;
        }

        if (/^(-|\*|\+)\s+/m.test(block) && block.split('\n').every(line => /^(-|\*|\+)\s+/.test(line.trim()))) {
          const items = block.split('\n').map(line => line.replace(/^(-|\*|\+)\s+/, '').trim()).map(item => `<li>${inlineFormat(escapeHtml(item))}</li>`).join('');
          html += `<ul class="preview-block" data-source-line="${startLine}">${items}</ul>`;
          continue;
        }

        if (/^\d+\.\s+/m.test(block) && block.split('\n').every(line => /^\d+\.\s+/.test(line.trim()))) {
          const items = block.split('\n').map(line => line.replace(/^\d+\.\s+/, '').trim()).map(item => `<li>${inlineFormat(escapeHtml(item))}</li>`).join('');
          html += `<ol class="preview-block" data-source-line="${startLine}">${items}</ol>`;
          continue;
        }

        const paragraph = block.split('\n').map(line => inlineFormat(escapeHtml(line.trim()))).join('<br>');
        html += `<p class="preview-block" data-source-line="${startLine}">${paragraph}</p>`;
      }

      return html;
    }

    function getSignatureLabel() {
      if (!ARTICLE_SIGNATURE || !ARTICLE_SIGNATURE.author || !ARTICLE_SIGNATURE.issue) return '';
      return `${ARTICLE_SIGNATURE.author}的第${ARTICLE_SIGNATURE.issue}篇原创`;
    }

    function injectSignature(root) {
      const label = getSignatureLabel();
      if (!label) return;
      const images = Array.from(root.querySelectorAll('img'));
      const cover = images.find(img => /题图|cover/i.test(img.getAttribute('alt') || '')) || images[0];
      if (!cover) return;
      const existing = root.querySelector('.article-signature');
      if (existing) existing.remove();
      const signature = document.createElement('p');
      signature.className = 'article-signature';
      const text = document.createElement('span');
      text.textContent = label;
      signature.appendChild(text);
      const imageBlock = cover.parentElement && cover.parentElement.tagName === 'P' ? cover.parentElement : cover;
      imageBlock.insertAdjacentElement('afterend', signature);
    }

    function buildInlineWechatHtml() {
      const color = themeColor.value;
      const accent = '#d14d72';
      const font = fontFamily.value;
      const safeFont = font.replace(/"/g, "'");
      const size = fontSize.value || '16';

      const root = document.createElement('div');
      root.innerHTML = markdownToHtml(editor.value);
      injectSignature(root);

      const setStyle = (selector, style) => {
        root.querySelectorAll(selector).forEach(el => {
          el.setAttribute('style', style);
        });
      };

      const codeBlockStyle = [
        'width:100%',
        'max-width:100%',
        'box-sizing:border-box',
        'margin:16px 8px',
        'padding:14px 16px',
        'background:#111827',
        'color:#e5e7eb',
        'border-radius:10px',
        'font-size:14px',
        'line-height:1.7',
        'font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace',
        'word-break:break-word',
        'overflow-wrap:anywhere'
      ].join(';');

      // 关键修复：复制给公众号时，代码块不再保留 pre/code，避免被识别成行内 code 红色字段。
      root.querySelectorAll('pre').forEach(pre => {
        const code = pre.querySelector('code');
        const codeText = code ? code.textContent : pre.textContent;

        const block = document.createElement('p');
        block.setAttribute('data-wx-code-block', '1');
        block.setAttribute('style', codeBlockStyle);

        const sourceLine = pre.getAttribute('data-source-line');
        if (sourceLine) block.setAttribute('data-source-line', sourceLine);
        if (pre.className) block.className = pre.className;

        const lines = codeText.replace(/\n$/, '').split('\n');
        block.innerHTML = lines.map(line => {
          const escaped = escapeHtml(line).replace(/ /g, '&nbsp;');
          return escaped || '&nbsp;';
        }).join('<br>');

        pre.replaceWith(block);
      });

      setStyle('h1', `width:fit-content; margin:26px auto 16px; font-size:19px; line-height:1.75; font-weight:700; color:#111827; padding-bottom:8px; border-bottom:2px solid ${color}; text-align:center;`);
      setStyle('h2', `width:fit-content; margin:30px auto 18px; font-size:19px; line-height:1.6; font-weight:700; color:#fff; background:${color}; padding:8px 20px; border-radius:7px; box-shadow:0 4px 10px rgba(15,23,42,.16); text-align:center;`);
      setStyle('h3', `width:fit-content; margin:24px 0 14px; font-size:17px; line-height:1.75; font-weight:700; color:#111827; padding:0 0 3px 10px; border-left:4px solid ${color}; border-bottom:1px dashed ${color};`);
      setStyle('h4', `margin:18px 0 10px; font-size:16px; line-height:1.75; font-weight:700; color:${color};`);
      setStyle('p', `font-family:${safeFont}; margin:16px 8px; font-size:${size}px; line-height:1.75; color:#222; word-break:break-word;`);
      setStyle('blockquote', `margin:18px 0; padding:14px 16px; background:#f7f8fa; border-left:4px solid ${color}; color:#3b4552; font-size:${size}px; line-height:1.75; border-radius:8px;`);
      setStyle('ul', `margin:16px 0; padding-left:1.5em; font-size:${size}px; line-height:1.75;`);
      setStyle('ol', `margin:16px 0; padding-left:1.5em; font-size:${size}px; line-height:1.75;`);
      setStyle('li', 'margin:8px 0;');
      setStyle('table', 'width:100%; border-collapse:collapse; margin:18px 0; display:block; overflow-x:auto; border:1px solid #eaecf0;');
      setStyle('thead', 'background:#f8fafc;');
      setStyle('th', 'padding:10px 12px; border-bottom:1px solid #eaecf0; text-align:left; white-space:nowrap; font-size:14px;');
      setStyle('td', 'padding:10px 12px; border-bottom:1px solid #eaecf0; text-align:left; white-space:nowrap; font-size:14px;');
      setStyle('img', 'max-width:100%; display:block; margin:0 auto; border-radius:8px;');
      root.querySelectorAll('p').forEach(p => {
        if (p.children.length === 1 && p.children[0].tagName === 'IMG') {
          p.setAttribute('style', `font-family:${safeFont}; margin:22px 8px; font-size:${size}px; line-height:1.75; color:#222; word-break:break-word; text-align:center;`);
        }
      });
      setStyle('[data-wx-code-block]', codeBlockStyle);
      setStyle('.article-signature', `font-family:${safeFont}; margin:21px 8px; color:#fff; font-size:14px; line-height:1.45; font-weight:400; text-align:center; word-break:break-word;`);
      setStyle('.article-signature span', `display:inline; padding:1px 5px 2px; background:${color}; color:#fff; font-size:14px; line-height:1.45; font-weight:400;`);
      setStyle('a', `color:${color}; text-decoration:none; border-bottom:1px solid rgba(23,179,148,.35);`);
      setStyle('strong', `font-weight:700; color:${color};`);
      setStyle('span.inline-accent', `color:${accent}; font-weight:700;`);
      setStyle('em', 'color:#444;');
      setStyle('hr', 'border:0; border-top:1px dashed #d0d5dd; margin:28px 0;');

      // 剩下的 code 都是行内代码。
      setStyle('code', `background:#f2f4f7; border:1px solid #eaecf0; border-radius:6px; padding:.12em .38em; font-size:.92em; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; color:${accent}; font-weight:700;`);

      root.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach(heading => {
        const p = document.createElement('p');
        p.innerHTML = heading.innerHTML;
        p.setAttribute('style', heading.getAttribute('style') || '');
        heading.replaceWith(p);
      });

      root.querySelectorAll('blockquote').forEach(blockquote => {
        const p = document.createElement('p');
        p.innerHTML = blockquote.innerText.split('\n').map(line => escapeHtml(line.trim())).filter(Boolean).join('<br>');
        p.setAttribute('style', `font-family:${safeFont}; margin:18px 8px; padding:14px 16px; background:#f7f8fa; border-left:4px solid ${color}; color:#3b4552; font-size:${size}px; line-height:1.75; border-radius:8px; word-break:break-word;`);
        blockquote.replaceWith(p);
      });

      root.querySelectorAll('ul,ol').forEach(list => {
        const p = document.createElement('p');
        const ordered = list.tagName === 'OL';
        const lines = Array.from(list.children).map((item, index) => `${ordered ? `${index + 1}.` : '•'} ${item.innerHTML}`);
        p.innerHTML = lines.join('<br>');
        p.setAttribute('style', `font-family:${safeFont}; margin:16px 8px; font-size:${size}px; line-height:1.75; color:#222; word-break:break-word;`);
        list.replaceWith(p);
      });

      root.querySelectorAll('table').forEach(table => {
        const p = document.createElement('p');
        const rows = Array.from(table.querySelectorAll('tr')).map(row => Array.from(row.children).map(cell => cell.innerText.trim()).join(' | '));
        p.innerHTML = rows.map(escapeHtml).join('<br>');
        p.setAttribute('style', `font-family:${safeFont}; margin:16px 8px; font-size:${size}px; line-height:1.75; color:#222; word-break:break-word;`);
        table.replaceWith(p);
      });

      root.querySelectorAll('section,div,blockquote,pre,ul,ol').forEach(node => {
        node.replaceWith(...Array.from(node.childNodes));
      });

      return root.innerHTML.trim();
    }

    function getEditorLineHeight() {
      const styles = getComputedStyle(editor);
      const font = parseFloat(styles.fontSize) || 15;
      const lineHeight = parseFloat(styles.lineHeight);
      return Number.isFinite(lineHeight) ? lineHeight : font * 1.75;
    }

    function getActiveSelectionOffset(textarea) {
      return textarea.selectionDirection === 'backward'
        ? textarea.selectionStart
        : textarea.selectionEnd;
    }

    function getLineNumberAtOffset(text, offset) {
      const numericOffset = Number(offset) || 0;
      const safeOffset = Math.min(Math.max(numericOffset, 0), text.length);
      return text.slice(0, safeOffset).split('\n').length;
    }

    function getCaretLine() {
      return getLineNumberAtOffset(editor.value, getActiveSelectionOffset(editor));
    }

    function getFirstVisibleEditorLine() {
      return Math.max(1, Math.floor(editor.scrollTop / getEditorLineHeight()) + 1);
    }

    function getMarkdownLineCount() {
      return editor.value ? editor.value.split('\n').length : 1;
    }

    function getPreviewBlocks() {
      return Array.from(preview.querySelectorAll('[data-source-line]'));
    }

    function getPositionInPreviewShell(element) {
      const shellRect = previewShell.getBoundingClientRect();
      const rect = element.getBoundingClientRect();
      return previewShell.scrollTop + (rect.top - shellRect.top);
    }

    function findPreviewScrollForLine(lineNo) {
      const blocks = getPreviewBlocks();
      const totalLines = getMarkdownLineCount();
      if (!blocks.length) return 0;

      for (let i = 0; i < blocks.length; i++) {
        const currentLine = Number(blocks[i].dataset.sourceLine) || 1;
        const nextLine = i + 1 < blocks.length ? Number(blocks[i + 1].dataset.sourceLine) || (totalLines + 1) : totalLines + 1;
        if (lineNo < nextLine || i === blocks.length - 1) {
          const currentTop = getPositionInPreviewShell(blocks[i]);
          const nextTop = i + 1 < blocks.length ? getPositionInPreviewShell(blocks[i + 1]) : currentTop + blocks[i].offsetHeight;
          const span = Math.max(1, nextLine - currentLine);
          const ratio = clamp((lineNo - currentLine) / span, 0, 1);
          return currentTop + (nextTop - currentTop) * ratio;
        }
      }

      return 0;
    }

    function findEditorLineForPreviewScroll(scrollTop) {
      const blocks = getPreviewBlocks();
      const totalLines = getMarkdownLineCount();
      if (!blocks.length) return 1;

      const anchor = scrollTop + 1;
      for (let i = 0; i < blocks.length; i++) {
        const currentTop = getPositionInPreviewShell(blocks[i]);
        const nextTop = i + 1 < blocks.length ? getPositionInPreviewShell(blocks[i + 1]) : currentTop + blocks[i].offsetHeight;
        if (anchor < nextTop || i === blocks.length - 1) {
          const currentLine = Number(blocks[i].dataset.sourceLine) || 1;
          const nextLine = i + 1 < blocks.length ? Number(blocks[i + 1].dataset.sourceLine) || (totalLines + 1) : totalLines + 1;
          const distance = Math.max(1, nextTop - currentTop);
          const ratio = clamp((anchor - currentTop) / distance, 0, 1);
          return Math.round(currentLine + (nextLine - currentLine) * ratio);
        }
      }

      return 1;
    }

    function holdScrollLock(source) {
      activeScrollSource = source;
      clearTimeout(scrollReleaseTimer);
      scrollReleaseTimer = setTimeout(() => {
        activeScrollSource = null;
      }, 80);
    }

    function syncPreviewToEditor(anchorMode = 'viewport') {
      const lineNo = anchorMode === 'caret' ? getCaretLine() : getFirstVisibleEditorLine();
      const target = findPreviewScrollForLine(lineNo);
      const maxScroll = Math.max(0, previewShell.scrollHeight - previewShell.clientHeight);
      previewShell.scrollTop = clamp(target, 0, maxScroll);
    }

    function syncEditorToPreview() {
      const lineHeight = getEditorLineHeight();
      const lineNo = findEditorLineForPreviewScroll(previewShell.scrollTop);
      const target = Math.max(0, (lineNo - 1) * lineHeight);
      const maxScroll = Math.max(0, editor.scrollHeight - editor.clientHeight);
      editor.scrollTop = clamp(target, 0, maxScroll);
    }

    function syncAfterRender(preferredSource = 'editor', editorAnchor = 'viewport') {
      requestAnimationFrame(() => {
        holdScrollLock(preferredSource);
        if (preferredSource === 'preview') {
          syncEditorToPreview();
        } else {
          syncPreviewToEditor(editorAnchor);
        }
      });
    }

    function scheduleCaretSync() {
      if (caretSyncFrame !== null) return;
      caretSyncFrame = requestAnimationFrame(() => {
        caretSyncFrame = null;
        holdScrollLock('editor');
        syncPreviewToEditor('caret');
      });
    }

    function safeGetStorage(key) {
      try {
        return localStorage.getItem(key);
      } catch {
        return null;
      }
    }

    function safeSetStorage(key, value) {
      try {
        localStorage.setItem(key, value);
        return true;
      } catch {
        return false;
      }
    }

    function isLoopbackServer() {
      return (location.protocol === 'http:' || location.protocol === 'https:')
        && (location.hostname === '127.0.0.1' || location.hostname === 'localhost');
    }

    async function saveStateToServer(data) {
      if (!isLoopbackServer()) return false;
      try {
        const response = await fetch(WORKBENCH_SAVE_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Workbench-Token': window.__workbenchToken || '' },
          body: JSON.stringify(Object.assign({}, data, {baseRevision: window.__workbenchRevision || 0, clientMutationId: 'client-' + Date.now()}))
        });
        if (response.status === 409) { const latest = await response.json(); window.__workbenchRevision = latest.coreRevision || window.__workbenchRevision; return false; }
        if (!response.ok) return false;
        const result = await response.json();
        if (!result.saved) throw new Error(result.error || 'save failed');
        updateServerStatus(result);
        storageModeLabel.textContent = '自动保存：HTML 文件 + localStorage';
        saveStatus.textContent = '已写入 HTML';
        return true;
      } catch {
        return false;
      }
    }
    async function handshakeWorkbench() { if (!isLoopbackServer()) return; try { const r = await fetch('/__wechat_workbench/status'); if (!r.ok) throw new Error(); const s = await r.json(); window.__workbenchToken=s.token; window.__workbenchRevision=s.coreRevision||0; } catch (_) { window.__workbenchToken=null; } }
    handshakeWorkbench();
    function updateServerStatus(status) {
      manifestStatus.textContent = status.manifest_updated ? '发布清单已更新' : '发布清单待刷新';
      assetsStatus.textContent = status.manifest_status === 'ok' ? '图片状态已检查' : '图片状态待检查';
    }

    function updatePreview(preferredSource = activeScrollSource || 'editor', editorAnchor = 'viewport') {
      preview.innerHTML = markdownToHtml(editor.value);
      injectSignature(preview);
      const text = editor.value.replace(/\s+/g, '');
      wordCount.textContent = `${text.length} 字`;
      lineCount.textContent = `${editor.value.split('\n').length} 行`;
      saveStatus.textContent = '编辑中…';
      syncAfterRender(preferredSource, editorAnchor);
    }

    function scheduleSave() {
      if (window.workbenchSaveController) window.workbenchSaveController.cacheAndSchedule();
    }

    function applySettings() {
      document.documentElement.style.setProperty('--primary', themeColor.value);
      document.documentElement.style.setProperty('--preview-font', fontFamily.value);
      updatePreview(activeScrollSource || 'editor');
      if (!initializing) scheduleSave();
    }

    window.workbenchSaveController = createWorkbenchSaveController({
      storage: localStorage,
      storageKey: STORAGE_KEY,
      snapshot: () => ({ markdown: editor.value, themeColor: themeColor.value, fontSize: fontSize.value, fontFamily: fontFamily.value, savedAt: new Date().toISOString() }),
      transport: data => saveStateToServer(data),
      onStateChange: state => {
        const labels = {cached:'已缓存到本机', saving:'正在保存正文…', saved:'正文已保存', error:'保存失败'};
        if (labels[state]) { saveStatus.textContent = labels[state]; articleStatus.textContent = labels[state]; }
        if (state === 'saved') lastSavedLabel.textContent = `最近保存：${new Date().toLocaleTimeString('zh-CN')}`;
      }
    });
    document.getElementById('saveArticle').addEventListener('click', () => window.workbenchSaveController.saveNow());

    function loadState() {
      const raw = safeGetStorage(STORAGE_KEY);
      if (!raw) {
        editor.value = DEFAULT_MARKDOWN;
        themeColor.value = DEFAULT_WORKBENCH_STATE.themeColor;
        fontSize.value = DEFAULT_WORKBENCH_STATE.fontSize;
        fontFamily.value = DEFAULT_WORKBENCH_STATE.fontFamily;
        return;
      }
      try {
        const data = JSON.parse(raw);
        editor.value = data.markdown && data.markdown.trim() ? data.markdown : DEFAULT_MARKDOWN;
        themeColor.value = data.themeColor || DEFAULT_WORKBENCH_STATE.themeColor;
        fontSize.value = data.fontSize || DEFAULT_WORKBENCH_STATE.fontSize;
        fontFamily.value = data.fontFamily || DEFAULT_WORKBENCH_STATE.fontFamily;
      } catch {
        editor.value = DEFAULT_MARKDOWN;
      }
    }

    function absoluteImageUrl(src) {
      try {
        return new URL(src, document.baseURI).href;
      } catch {
        return src;
      }
    }

    function mimeTypeForImageSrc(src) {
      const clean = String(src || '').split(/[?#]/, 1)[0].toLowerCase();
      if (clean.endsWith('.jpg') || clean.endsWith('.jpeg')) return 'image/jpeg';
      if (clean.endsWith('.webp')) return 'image/webp';
      return 'image/png';
    }

    function clipboardMappedDataUri(src) {
      const assets = window.WECHAT_CLIPBOARD_IMAGE_DATA || {};
      return assets[src] || assets[decodeURI(src)] || assets[absoluteImageUrl(src)] || '';
    }

    function blobToDataUri(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ''));
        reader.onerror = () => reject(reader.error || new Error('blob read failed'));
        reader.readAsDataURL(blob);
      });
    }

    async function fetchImageDataUri(src) {
      const response = await fetch(absoluteImageUrl(src));
      if (!response.ok) throw new Error('image fetch failed');
      const blob = await response.blob();
      return blobToDataUri(blob);
    }

    function waitForClipboardImage(img) {
      if (img.complete && img.naturalWidth > 0) return Promise.resolve(img);
      return new Promise((resolve, reject) => {
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error('image load failed'));
      });
    }

    async function imageToDataUri(img) {
      const src = img.getAttribute('src') || img.currentSrc || img.src;
      if (!src || /^data:image\//i.test(src)) return src;
      const mapped = clipboardMappedDataUri(src);
      if (mapped) return mapped;
      try {
        return await fetchImageDataUri(src);
      } catch {
        // file:// images cannot be fetched by Chrome; the generated sidecar covers that path.
      }
      const absoluteSrc = absoluteImageUrl(src);
      const image = await waitForClipboardImage(img);
      const canvas = document.createElement('canvas');
      canvas.width = image.naturalWidth || image.width;
      canvas.height = image.naturalHeight || image.height;
      const context = canvas.getContext('2d');
      if (!context || !canvas.width || !canvas.height) return src;
      context.drawImage(image, 0, 0);
      return canvas.toDataURL(mimeTypeForImageSrc(absoluteSrc));
    }

    async function inlineImagesForClipboard(root) {
      const images = Array.from(root.querySelectorAll('img'));
      let converted = 0;
      let failed = 0;
      for (const img of images) {
        const originalSrc = img.getAttribute('src') || img.currentSrc || img.src;
        if (!originalSrc || /^data:image\//i.test(originalSrc)) continue;
        try {
          img.setAttribute('src', await imageToDataUri(img));
          converted += 1;
        } catch {
          failed += 1;
        }
      }
      return { converted, failed };
    }

    function createClipboardBox() {
      const box = document.createElement('article');
      box.className = 'preview';
      box.style.position = 'fixed';
      box.style.left = '-99999px';
      box.style.top = '0';
      box.style.width = getComputedStyle(preview).width || '430px';
      box.style.maxWidth = getComputedStyle(preview).width || '430px';
      box.style.background = '#fff';
      box.innerHTML = preview.innerHTML;
      return box;
    }

    function copyBoxBySelection(box) {
      const selection = window.getSelection();
      const range = document.createRange();
      try {
        selection.removeAllRanges();
        range.selectNodeContents(box);
        selection.addRange(range);
        return document.execCommand('copy');
      } finally {
        selection.removeAllRanges();
      }
    }

    async function copyRichHtmlWithEmbeddedImages() {
      const box = createClipboardBox();
      document.body.appendChild(box);
      try {
        const imageResult = await inlineImagesForClipboard(box);
        const html = box.innerHTML;
        const plain = box.innerText;
        if (navigator.clipboard && window.ClipboardItem) {
          const item = new ClipboardItem({
            'text/html': new Blob([html], { type: 'text/html' }),
            'text/plain': new Blob([plain], { type: 'text/plain' })
          });
          await navigator.clipboard.write([item]);
          return imageResult;
        }
        const copied = copyBoxBySelection(box);
        if (!copied) throw new Error('copy failed');
        return imageResult;
      } finally {
        document.body.removeChild(box);
      }
    }

    async function copyWechatContent() {
      saveStatus.textContent = '正在准备图片…';
      try {
        const result = await copyRichHtmlWithEmbeddedImages();
        saveStatus.textContent = result.failed ? '已复制富文本，部分图片保持原路径' : '已复制富文本';
      } catch (e) {
        saveStatus.textContent = '复制失败，请手动复制右侧预览';
      }
    }

    function getArticleTitle() {
      const match = editor.value.match(/^\s*#\s+(.+?)\s*$/m);
      return match ? match[1].trim() : document.title.replace(/工作台$/, '').trim();
    }

    function getArticleDigest(limit = 120) {
      const withoutImages = editor.value
        .replace(/!\[[^\]]*\]\([^)]+\)/g, '')
        .replace(/```[\s\S]*?```/g, '')
        .split(/\n\s*\n/)
        .map(block => block
          .replace(/^#{1,6}\s+/gm, '')
          .replace(/^>\s?/gm, '')
          .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
          .replace(/==([^=\n]+)==/g, '$1')
          .replace(/[`*_]/g, '')
          .replace(/\s+/g, ' ')
          .trim())
        .filter(Boolean);
      const firstBody = withoutImages.find(block => block !== getArticleTitle()) || '';
      return firstBody.slice(0, limit);
    }

    function getArticleImages() {
      const images = [];
      const re = /!\[([^\]]*)\]\(([^)]+)\)/g;
      let match;
      while ((match = re.exec(editor.value))) {
        const alt = match[1] || '';
        let name = `image-${images.length + 1}`;
        if (/题图|cover/i.test(alt)) name = 'cover';
        if (/尾图|closing/i.test(alt)) name = 'closing';
        images.push({ name, alt, src: match[2] });
      }
      return images;
    }

    window.__WECHAT_ARTICLE_EXPORT__ = function() {
      const images = getArticleImages();
      const cover = images.find(image => image.name === 'cover') || images[0] || null;
      return {
        metadata: ARTICLE_METADATA,
        title: getArticleTitle(),
        digest: getArticleDigest(),
        content_html: buildInlineWechatHtml(),
        content_text: preview.innerText,
        images,
        cover,
        themeColor: themeColor.value,
        fontSize: fontSize.value,
        fontFamily: fontFamily.value,
        exportedAt: new Date().toISOString()
      };
    };

    editor.addEventListener('input', () => {
      holdScrollLock('editor');
      updatePreview('editor', 'caret');
      scheduleSave();
    });

    editor.addEventListener('click', scheduleCaretSync);
    editor.addEventListener('keyup', scheduleCaretSync);
    editor.addEventListener('select', scheduleCaretSync);

    editor.addEventListener('scroll', () => {
      if (activeScrollSource === 'preview') return;
      holdScrollLock('editor');
      syncPreviewToEditor('viewport');
    });

    previewShell.addEventListener('scroll', () => {
      if (activeScrollSource === 'editor') return;
      holdScrollLock('preview');
      syncEditorToPreview();
    });

    themeColor.addEventListener('input', applySettings);
    fontSize.addEventListener('change', applySettings);
    fontFamily.addEventListener('change', applySettings);
    document.getElementById('copyWechat').addEventListener('click', copyWechatContent);

    loadState();
    applySettings();
    updatePreview('editor');
    initializing = false;
    saveStatus.textContent = '已加载';
  </script>
</body>
</html>
