name: Test and Package Skill

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install test dependencies
        run: python -m pip install "Pillow>=10"

      - name: Validate installable skill structure
        run: |
          test -f wechat-article-pipeline/SKILL.md
          test -f wechat-article-pipeline/VERSION
          test -f wechat-article-pipeline/agents/openai.yaml
          test -f wechat-article-pipeline/.env.example
          test -f wechat-article-pipeline/references/platform-adapters.json
          test -d wechat-article-pipeline/scripts
          python -m unittest tests.test_skill_p0_contract.SkillP0ContractTest.test_skill_md_stays_lean_and_trigger_description_is_not_a_workflow -v
          python wechat-article-pipeline/scripts/doctor_wechat_article_skill.py --skip-installed

      - name: Compile Python sources
        run: python -m compileall -q wechat-article-pipeline/scripts tests wechat-article-pipeline/tests

      - name: Run Python tests and end-to-end smoke test
        run: |
          python tests/run_ci_unittests.py tests
          python tests/run_ci_unittests.py wechat-article-pipeline/tests

      - name: Run workbench JavaScript tests
        run: node --test tests/*.test.mjs

  package:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          PROJECT_VERSION="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          SKILL_VERSION="$(tr -d '[:space:]' < wechat-article-pipeline/VERSION)"
          if [ "${PROJECT_VERSION}" != "${SKILL_VERSION}" ]; then
            echo "pyproject ${PROJECT_VERSION} does not match skill VERSION ${SKILL_VERSION}." >&2
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            if [ "${GITHUB_REF_NAME}" != "v${PROJECT_VERSION}" ]; then
              echo "Tag ${GITHUB_REF_NAME} does not match pyproject version v${PROJECT_VERSION}." >&2
              exit 1
            fi
            VERSION="${PROJECT_VERSION}"
          else
            VERSION="${PROJECT_VERSION}-dev.${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "project_version=${PROJECT_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Build skill zip
        shell: bash
        run: |
          rm -rf build dist
          mkdir -p build dist
          rsync -a \
            --exclude=".DS_Store" \
            --exclude=".env" \
            --exclude=".env.lock" \
            --exclude="*.lock" \
            --exclude="__pycache__/" \
            --exclude="*.pyc" \
            wechat-article-pipeline/ build/wechat-article-pipeline/
          python wechat-article-pipeline/scripts/doctor_wechat_article_skill.py \
            --source wechat-article-pipeline \
            --installed build/wechat-article-pipeline \
            --require-installed-sync
          cd build
          zip -r "../dist/wechat-article-pipeline-${{ steps.version.outputs.version }}.zip" wechat-article-pipeline
          cd ..
          sha256sum "dist/wechat-article-pipeline-${{ steps.version.outputs.version }}.zip" \
            > "dist/wechat-article-pipeline-${{ steps.version.outputs.version }}.zip.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: wechat-article-pipeline-skill
          path: dist/*
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged skill
        uses: actions/download-artifact@v4
        with:
          name: wechat-article-pipeline-skill
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              --verify-tag
          fi
